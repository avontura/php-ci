name: Clean up Docker artifacts

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Delete temporary Docker artifacts
        shell: bash
        run: |
          set -euo pipefail

          endpoint="repos/${GITHUB_REPOSITORY}/actions/artifacts"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_run ]]; then
            endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          fi

          artifact_ids=$(gh api --paginate "${endpoint}" \
            --jq '.artifacts[] | select((.name | startswith("shared-base-")) or (.name | endswith(".dockerbuild"))) | .id')

          if [[ -n "${artifact_ids}" ]]; then
            while IFS= read -r artifact_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Deleted temporary artifact ${artifact_id}"
            done <<< "${artifact_ids}"
          fi
