name: Docker

on:
  # Rebuild nightly so PHP and distro patches reach the pipeline without anyone
  # asking. Dependabot below catches what changes a file; this catches what does
  # not - which is how the previous CI image sat ten months behind on PHP.
  schedule:
    - cron: '15 5 * * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

# One branch builds every PHP version: the php matrix below is the list of
# published versions, and each tag is named after its entry, not after the
# branch. Adding a version is an entry in both matrices plus its typst-<version>
# stage in the Dockerfile.
jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.5" ]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Export one exact base for every variant job, including on fork PRs that
      # cannot publish to GHCR. Keep the existing shared-toolchain cache.
      - name: Build shared base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: base
          platforms: linux/amd64
          build-args: PHP_VERSION=${{ matrix.php }}
          outputs: type=oci,dest=${{ runner.temp }}/base.tar
          provenance: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=base-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.php }}

      # Named per PHP version: a matrix job has one set of outputs, so the build
      # jobs find their base by name rather than by an artifact ID output.
      # Named per run, not per attempt: "Re-run failed jobs" re-runs a failed
      # variant as a new attempt but keeps the base the run already built, so
      # the variant has to find that base under the same name. A full re-run
      # builds the base again and overwrites it.
      - name: Upload shared base
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-base-${{ matrix.php }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/base.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    needs: base

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.5" ]
        target: [ thin, ffmpeg, vips, vips-hunspell, playwright ]
    permissions:
      contents: read
      packages: write
      # Completes the identity challenge with sigstore/fulcio outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cosign-release: the installer's own default is the cosign it ships
      # checksums for, so Dependabot's bump of this action bumps cosign with it.
      # A pin here is a second version Dependabot cannot see.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download shared base
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-base-${{ matrix.php }}-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-base
          merge-multiple: true

      - name: Resolve shared base context
        id: base-context
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          tar -xf "$RUNNER_TEMP/shared-base/base.tar" -C "$RUNNER_TEMP/base"
          digest="$(jq -er '.manifests | select(length == 1) | .[0].digest' "$RUNNER_TEMP/base/index.json")"
          echo "context=base=oci-layout://$RUNNER_TEMP/base@$digest" >> "$GITHUB_OUTPUT"

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.target != 'thin' && format('-{0}', matrix.target) || '' }}
          # Refresh the moving PHP tag (8.5, 8.5-ffmpeg) on pushes AND
          # schedules. SHA tags name source revisions; dated tags identify each
          # variant's nightly build. Every tag starts with the PHP version, so
          # two versions built from one commit or on one night never share one.
          # The prefixes are per tag: a tag's own prefix replaces the flavor's
          # rather than adding to it, and type=sha always has one (sha-).
          tags: |
            type=raw,value=${{ matrix.php }},enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr,prefix=${{ matrix.php }}-pr-
            type=sha,format=long,prefix=${{ matrix.php }}-sha-,enable=${{ github.event_name == 'push' }}
            type=schedule,pattern={{date 'YYYYMMDD'}},prefix=${{ matrix.php }}-

      # linux/amd64 only: Bitbucket Pipelines runs amd64, and an emulated arm64
      # leg would double the build for an architecture no pipeline pulls.
      #
      # A pull request builds without pushing, so it still runs the invariant
      # check baked into the Dockerfile - which is why that check lives there
      # and not only in the smoke test below.
      - name: Build and push variant
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PHP_VERSION=${{ matrix.php }}
          build-contexts: ${{ steps.base-context.outputs.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The named context replaces the base stage; matrix jobs never
          # rebuild it. Refresh only the selected variant on nightly runs, and
          # for vips-hunspell the vips stage it builds on as well, or its
          # libvips packages would stay at whatever the cache last held.
          no-cache-filters: ${{ github.event_name == 'schedule' && (matrix.target == 'vips-hunspell' && 'vips,vips-hunspell' || matrix.target) || '' }}
          cache-from: type=gha,scope=php-ci-${{ matrix.php }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=php-ci-${{ matrix.php }}-${{ matrix.target }}

      # Runs the image's own php-ci-check against the published digest, so it
      # tests what a pipeline will actually pull rather than what the builder
      # believes it made. A pull request has nothing to pull; the same script
      # ran at the end of each stage of its build.
      # Read from the Dockerfile so the smoke test expects the pnpm the build
      # pinned, and downloads the Chromium that install-deps was chosen for,
      # with no second copy of either version to drift.
      - name: Read pinned versions
        id: pinned
        run: |
          echo "playwright=$(sed -n 's/^ARG PLAYWRIGHT_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(sed -n 's/^ARG PNPM_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the published image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PLAYWRIGHT_VERSION: ${{ steps.pinned.outputs.playwright }}
          PNPM_VERSION: ${{ steps.pinned.outputs.pnpm }}
          PHP_VERSION: ${{ matrix.php }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          VARIANT: ${{ matrix.target }}
        run: |
          docker run --rm -e PNPM_VERSION -e PHP_VERSION "$IMAGE" php-ci-check "$VARIANT"
          # The image carries no browser, so download one the way a pipeline
          # does and launch it. Only possible here: the build has no browser to
          # launch.
          if [ "$VARIANT" = "playwright" ]; then
            docker run --rm -e PLAYWRIGHT_VERSION "$IMAGE" bash -c '
              set -eu
              smoke_dir="$(mktemp -d)"
              trap "rm -rf \"$smoke_dir\"" EXIT
              cd "$smoke_dir"
              export PLAYWRIGHT_BROWSERS_PATH="$smoke_dir/browsers"
              npx -y "playwright@$PLAYWRIGHT_VERSION" install chromium
              chrome="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome -path "*chromium-*" | head -n 1)"
              test -n "$chrome" || { echo "playwright did not download chromium"; exit 1; }
              if ldd "$chrome" | grep "not found"; then echo "chromium has unresolved libraries"; exit 1; fi
              "$chrome" --headless --no-sandbox --disable-gpu --dump-dom about:blank | grep -q "<html" || { echo "chromium cannot launch headless"; exit 1; }
              echo "chromium ok"
            '
          fi

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"
